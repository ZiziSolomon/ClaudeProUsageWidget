<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Claude Usage</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1c1c1e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #f5f5f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 32px 24px;
  }

  h1 {
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #888;
  }

  /* ---- three widgets ---- */
  .widgets {
    display: flex;
    gap: 32px;
    align-items: flex-start;
    justify-content: center;
  }

  .widget {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    min-width: 120px;
  }

  .widget-title {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #666;
  }

  /* ghost icon */
  .ghost-wrap {
    position: relative;
    width: 121px;
    height: 76px;
  }

  .ghost-wrap svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .ghost-filled {
    clip-path: inset(var(--clip-top, 100%) 0 0 0);
    transition: clip-path 0.5s ease;
  }

  /* arc widget */
  .arc-wrap svg {
    display: block;
  }

  #arc-text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 18px;
    font-weight: 700;
    fill: #fff;
  }

  .pct-label {
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .pct-label.weekly { color: #F5A623; }

  .sub-label {
    font-size: 0.7rem;
    color: #555;
    letter-spacing: 0.04em;
  }

  /* ---- sections ---- */
  .section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .section-title {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #555;
    /* clickable collapse header */
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
    transition: color 0.15s;
  }

  .section-title:hover { color: #888; }

  /* chevron: points down when open, right when collapsed */
  .section-title::after {
    content: "";
    width: 0;
    height: 0;
    border-left: 4px solid currentColor;
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    transform: rotate(90deg);
    transition: transform 0.15s;
  }

  .section.collapsed .section-title::after {
    transform: rotate(0deg);
  }

  .section-body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .section.collapsed .section-body { display: none; }

  /* ---- toggle buttons ---- */
  .toggles {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .toggle-btn {
    background: #2a2a2c;
    border: 1px solid transparent;
    color: #555;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 0.75rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    user-select: none;
  }

  .toggle-btn:hover {
    background: #333;
    color: #888;
  }

  .toggle-btn.on {
    background: #2A78D6;
    color: #fff;
  }

  .toggle-btn.on:hover {
    background: #3a88e6;
  }

  .action-btn {
    background: #2a2a2c;
    border: 1px solid transparent;
    color: #aaa;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 0.75rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    user-select: none;
  }

  .action-btn:hover {
    background: #333;
    color: #eee;
  }

  .action-btn:active {
    background: #444;
  }

  .action-btn.danger {
    color: #e06a52;
  }

  .action-btn.danger:hover {
    background: #3a2422;
    color: #ff7a5e;
  }

  /* ---- settings rows ---- */
  .setting-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .setting-label {
    font-size: 0.75rem;
    color: #888;
  }

  .setting-input {
    background: #2a2a2c;
    border: 1px solid #3a3a3c;
    color: #eee;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.75rem;
    font-family: inherit;
    outline: none;
    width: 110px;
  }

  .setting-input.narrow { width: 56px; }

  .setting-input:focus { border-color: #555; }

  /* ---- accuracy chart ---- */
  .chart-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .session-select {
    background: #2a2a2c;
    border: 1px solid #3a3a3c;
    color: #aaa;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.75rem;
    font-family: inherit;
    cursor: pointer;
    outline: none;
  }

  .session-select:focus {
    border-color: #555;
  }

  #chart-img {
    max-width: min(680px, 90vw);
    border-radius: 6px;
    display: none;
  }

  /* ---- appearance section ---- */
  .appearance-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 520px;
  }

  .appearance-row-label {
    font-size: 0.75rem;
    color: #888;
    min-width: 90px;
    text-align: right;
  }

  /* Native colour picker sized to match text inputs */
  .color-swatch {
    width: 36px;
    height: 28px;
    border: 1px solid #3a3a3c;
    border-radius: 6px;
    padding: 2px;
    background: #2a2a2c;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="widgets">

    <div class="ghost-wrap">

          d="M 17,36 L 17,48 L 29,48 L 29,59 L 35,59 L 35,71 L 41,71 L 41,59 L 47,59
             L 47,71 L 53,71 L 53,59 L 77,59 L 77,71 L 83,71 L 83,59 L 89,59 L 89,71
             L 95,71 L 95,59 L 101,59 L 101,48 L 113,48 L 113,36 L 101,36 L 101,13

             L 47,71 L 53,71 L 53,59 L 77,59 L 77,71 L 83,71 L 83,59 L 89,59 L 89,71
             L 95,71 L 95,59 L 101,59 L 101,48 L 113,48 L 113,36 L 101,36 L 101,13
             L 29,13 L 29,36 Z
             M 41,25 L 41,36 L 47,36 L 47,25 Z
             M 83,25 L 83,36 L 89,36 L 89,25 Z"/>
      </svg>
      <svg class="ghost-filled" id="week-fill" viewBox="0 0 121 76" xmlns="http://www.w3.org/2000/svg">
        <path id="week-fill-path" fill="#F5A623" fill-rule="evenodd"
          d="M 17,36 L 17,48 L 29,48 L 29,59 L 35,59 L 35,71 L 41,71 L 41,59 L 47,59
             L 47,71 L 53,71 L 53,59 L 77,59 L 77,71 L 83,71 L 83,59 L 89,59 L 89,71
             L 95,71 L 95,59 L 101,59 L 101,48 L 113,48 L 113,36 L 101,36 L 101,13

  <!-- Session clock -->

        <circle id="arc-track" cx="60.5" cy="60.5" r="54"
                fill="rgba(54,54,53,0.55)"/>
        <path id="arc-fill" d="" fill="#2A78D6"/>
        <text id="arc-text" x="60.5" y="60.5"
              text-anchor="middle" dominant-baseline="central">--</text>

    <div class="sub-label" id="arc-sub">time left</div>

</div>

<div class="section" data-section="taskbar">
  <div class="section-title">Show in taskbar</div>

      <button class="toggle-btn" data-key="show_weekly_ghost">Weekly ghost</button>
      <button class="toggle-btn" data-key="show_session_pct">Session %</button>

</div>

<div class="section" data-section="appearance">

  <div class="section-body">

    <!-- Session ghost row -->
    <div class="appearance-row">

      <input type="color" id="sess-base-swatch"   class="color-swatch" title="Base colour"/>
      <input type="text"  id="sess-base-color"     class="setting-input narrow" placeholder="#2A78D6"/>
      <input type="text"  id="sess-stops"          class="setting-input"        placeholder="90:#D64E2A"/>
      <select id="sess-fill-mode" class="session-select">
        <option value="level">Level</option>
        <option value="angular">Angular</option>
      </select>
      <button class="action-btn" id="sess-appearance-save">Save</button>
    </div>

    <!-- Weekly ghost row -->
    <div class="appearance-row">
      <span class="appearance-row-label">Weekly ghost</span>
      <input type="color" id="week-base-swatch"   class="color-swatch" title="Base colour"/>
      <input type="text"  id="week-base-color"     class="setting-input narrow" placeholder="#F5A623"/>
      <input type="text"  id="week-stops"          class="setting-input"        placeholder="90:#D64E2A"/>
      <select id="week-fill-mode" class="session-select">
        <option value="level">Level</option>
        <option value="angular">Angular</option>
      </select>
      <button class="action-btn" id="week-appearance-save">Save</button>
    </div>

    <!-- Session clock row -->
    <div class="appearance-row">
      <span class="appearance-row-label">Session clock</span>
      <input type="color" id="clock-base-swatch"  class="color-swatch" title="Base colour"/>
      <input type="text"  id="clock-base-color"    class="setting-input narrow" placeholder="#2A78D6"/>
      <input type="text"  id="clock-stops"         class="setting-input"        placeholder="90:#D64E2A"/>
      <select id="clock-fill-mode" class="session-select">
        <option value="level">Level</option>
        <option value="angular">Angular</option>
      </select>

    </div>

  </div>
</div>

<div class="section" data-section="log">
  <div class="section-title">Widget log</div>
  <div class="section-body">
    <div class="chart-row">
      <select id="session-select" class="session-select">
        <option value="">Loading…</option>
      </select>
      <button class="action-btn" id="chart-btn">Generate</button>
    </div>
    <img id="chart-img" alt="Accuracy chart"/>
  </div>
</div>

<script>
  const sessFill = document.getElementById('sess-fill');
  const sessPath = document.getElementById('sess-fill-path');
  const weekFill = document.getElementById('week-fill');
  const weekPath = document.getElementById('week-fill-path');
  const sessPct  = document.getElementById('sess-pct');
  const sessWhen = document.getElementById('sess-when');
  const weekPct  = document.getElementById('week-pct');
  const weekWhen = document.getElementById('week-when');
  const arcFill  = document.getElementById('arc-fill');
  const arcText  = document.getElementById('arc-text');
  const arcSub   = document.getElementById('arc-sub');

  // ---- colour resolver (mirrors Python resolve_widget_color exactly) ----
  // Parses "pct:hex[,pct:hex...]" stops CSV; returns [] on bad input.
  function parseColorStops(raw) {
    if (!raw || typeof raw !== 'string') return [];
    const stops = [];
    for (const part of raw.split(',')) {
      const t = part.trim();
      if (!t) continue;
      const colon = t.indexOf(':');
      if (colon < 0) continue;
      const pct = parseInt(t.slice(0, colon).trim(), 10);
      const hex = t.slice(colon + 1).trim();
      if (isNaN(pct) || pct < 0 || pct > 100) continue;
      if (!/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(hex)) continue;
      stops.push([pct, hex]);
    }
    stops.sort((a, b) => a[0] - b[0]);
    return stops;
  }

  // Step-resolve: return the hex of the highest stop whose threshold <= pct,
  // or baseColor when none qualify.  Semantics match Python's resolver.
  function resolveWidgetColor(pct, baseColor, colorStopsStr) {
    const stops = parseColorStops(colorStopsStr);
    let chosen = baseColor;
    for (const [threshold, hex] of stops) {
      if (threshold <= pct) chosen = hex;
    }
    return chosen;
  }

  // Widget config fetched from /prefs; populated by refreshPrefs().
  // Default values match the Python _WIDGET_DEFAULTS so the page renders
  // correctly before the first /prefs response arrives.
  let _widgetCfg = {
    session: { base_color: '#2A78D6', color_stops: '90:#D64E2A', fill_mode: 'level' },
    weekly:  { base_color: '#F5A623', color_stops: '90:#D64E2A', fill_mode: 'level' },
    clock:   { base_color: '#2A78D6', color_stops: '90:#D64E2A', fill_mode: 'angular' },
  };

  function setGhost(fillEl, pathEl, pct, widgetName) {
    const cfg = _widgetCfg[widgetName] || {};
    const color = resolveWidgetColor(pct, cfg.base_color || '#2A78D6', cfg.color_stops);

    if (cfg.fill_mode === 'angular') {
      // Angular fill: use an SVG clipPath containing a pie-slice wedge so
      // the ghost shape still masks the filled region.
      fillEl.style.removeProperty('--clip-top');
      fillEl.style.clipPath = '';  // clear level-mode CSS clip
      const clipId = 'angular-clip-' + widgetName;
      let clipEl = document.getElementById(clipId);
      if (!clipEl) {
        // Build the clipPath element once and reuse it.
        const ns = 'http://www.w3.org/2000/svg';
        const svg = fillEl.closest('svg') || fillEl.parentElement.querySelector('svg');
        const defs = document.createElementNS(ns, 'defs');
        clipEl = document.createElementNS(ns, 'clipPath');
        clipEl.id = clipId;
        const wedge = document.createElementNS(ns, 'path');
        wedge.id = clipId + '-wedge';
        clipEl.appendChild(wedge);
        defs.appendChild(clipEl);
        (svg || fillEl.parentElement).prepend(defs);
      }
      const wedgeEl = document.getElementById(clipId + '-wedge');
      // Ghost viewBox is 121x76; centre of visible body ~(65, 44).
      const cx = 65, cy = 44, r = 55;
      let d = '';
      if (pct >= 99.99) {
        d = `M ${cx} ${cy - r} A ${r} ${r} 0 1 1 ${cx - 0.001} ${cy - r} Z`;
      } else if (pct > 0) {
        const a1 = -Math.PI / 2;
        const a2 = a1 + 2 * Math.PI * (pct / 100);
        const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
        const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
        const large = pct > 50 ? 1 : 0;
        d = `M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`;
      }
      if (wedgeEl) wedgeEl.setAttribute('d', d);
      fillEl.setAttribute('clip-path', `url(#${clipId})`);
    } else {
      // Level fill: existing CSS clip-path bottom-to-top.
      fillEl.setAttribute('clip-path', '');
      fillEl.style.setProperty('--clip-top', (100 - pct) + '%');
    }

    pathEl.setAttribute('fill', color);
  }

  function fmtWhen(iso, label) {
    if (!iso) return label;
    const mins = Math.round((new Date(iso) - Date.now()) / 60000);
    if (mins <= 0)  return 'resetting…';
    if (mins < 60)  return `in ${mins}m`;
    const h = Math.floor(mins / 60), m = mins % 60;
    if (h < 24)    return m > 0 ? `in ${h}h ${m}m` : `in ${h}h`;
    const d = Math.floor(h / 24), rh = h % 24;
    return rh > 0 ? `in ${d}d ${rh}h` : `in ${d}d`;
  }

  function fmtArcLabel(remainMs) {
    const mins = Math.round(remainMs / 60000);
    if (mins <= 0)  return '0m';
    if (mins < 60)  return `${mins}m`;
    const h = Math.floor(mins / 60), m = mins % 60;
    return m > 0 ? `${h}h ${m}m` : `${h}h`;
  }

  function updateArc(sessionStart, sessionEnd) {
    const cx = 60.5, cy = 60.5, r = 54;
    if (!sessionStart || !sessionEnd) {
      arcFill.setAttribute('d', '');
      arcText.textContent = '--';
      arcSub.textContent  = 'time left';
      return;
    }
    const now   = Date.now();
    const start = new Date(sessionStart).getTime();
    const end   = new Date(sessionEnd).getTime();
    if (now >= end) {
      arcFill.setAttribute('d', '');
      arcText.textContent = '--';
      arcSub.textContent  = 'resetting…';
      return;
    }
    const total    = end - start;
    const used     = now - start;
    const progress = Math.max(0, Math.min(1, used / total));
    const remain   = Math.max(0, end - now);

    if (progress <= 0) {
      arcFill.setAttribute('d', '');
    } else if (progress >= 0.9999) {
      arcFill.setAttribute('d',
        `M ${cx} ${cy - r} A ${r} ${r} 0 1 1 ${cx - 0.001} ${cy - r} Z`);
    } else {
      const a1 = -Math.PI / 2;
      const a2 = a1 + 2 * Math.PI * progress;
      const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
      const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
      const large = progress > 0.5 ? 1 : 0;
      arcFill.setAttribute('d',
        `M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`);
    }
    // Resolve arc colour from the clock widget config. Driver is elapsed %
    // (matching the PIL renderer) so a "90:#D64E2A" stop triggers at 90%
    // elapsed (= 10% remaining), mirroring the old alert condition.
    const cc = _widgetCfg.clock || {};
    const elapsedPct = progress * 100;
    const arcColor = resolveWidgetColor(elapsedPct, cc.base_color || '#2A78D6', cc.color_stops);
    arcFill.setAttribute('fill', arcColor);
    arcText.textContent = fmtArcLabel(remain);
    arcSub.textContent  = 'time left';
  }

  // ---- prefs / toggle buttons ----

  // Prefill an input only when the user is not currently editing it (the
  // existing guard pattern) and the incoming value differs from what's shown,
  // to avoid janky re-renders mid-type.
  function _prefill(el, value) {
    if (el && document.activeElement !== el && el.value !== String(value)) {
      el.value = value;
    }
  }

  async function refreshPrefs() {
    try {
      const p = await fetch('/prefs?t=' + Date.now()).then(r => r.json());
      document.querySelectorAll('.toggle-btn').forEach(btn => {
        const key = btn.dataset.key;
        btn.classList.toggle('on', !!p[key]);
      });
      // Prefill the numeric setting inputs, but never overwrite a field the
      // user is actively editing (refreshPrefs runs on a timer).
      const poll = document.getElementById('poll-input');
      if (document.activeElement !== poll && p.poll_interval_minutes != null) {
        poll.value = p.poll_interval_minutes;
      }
      const oneshot = document.getElementById('oneshot-input');
      if (document.activeElement !== oneshot && Array.isArray(p.liveness_oneshot_pcts)) {
        oneshot.value = p.liveness_oneshot_pcts.join(',');
      }
      const delta = document.getElementById('delta-input');
      if (document.activeElement !== delta && p.liveness_delta_pct != null) {
        delta.value = p.liveness_delta_pct;
      }

      // Update the in-memory widget config so setGhost / updateArc use fresh colours.
      if (p.widgets && typeof p.widgets === 'object') {
        _widgetCfg = { ..._widgetCfg, ...p.widgets };
      }

      // Prefill the Appearance section inputs.  The same activeElement guard
      // applies so a user mid-edit isn't interrupted by a background refresh.
      for (const [name, ids] of [
        ['session', { base: 'sess-base-color',  swatch: 'sess-base-swatch',  stops: 'sess-stops',  fill: 'sess-fill-mode'  }],
        ['weekly',  { base: 'week-base-color',  swatch: 'week-base-swatch',  stops: 'week-stops',  fill: 'week-fill-mode'  }],
        ['clock',   { base: 'clock-base-color', swatch: 'clock-base-swatch', stops: 'clock-stops', fill: 'clock-fill-mode' }],
      ]) {
        const cfg = (p.widgets || {})[name] || {};
        const baseEl   = document.getElementById(ids.base);
        const swatchEl = document.getElementById(ids.swatch);
        const stopsEl  = document.getElementById(ids.stops);
        const fillEl   = document.getElementById(ids.fill);
        _prefill(baseEl,  cfg.base_color  || '');
        // Sync colour picker with the text field when not editing either.
        if (swatchEl && document.activeElement !== swatchEl && cfg.base_color) {
          // Expand #rgb -> #rrggbb for the native colour input.
          let hex = cfg.base_color.trim();
          if (/^#[0-9a-fA-F]{3}$/.test(hex)) {
            hex = '#' + hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3];
          }
          swatchEl.value = hex;
        }
        _prefill(stopsEl, cfg.color_stops || '');
        if (fillEl && document.activeElement !== fillEl && cfg.fill_mode) {
          fillEl.value = cfg.fill_mode;
        }
      }
    } catch { /* server blip */ }
  }

  document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      await fetch('/toggle?key=' + btn.dataset.key, { method: 'POST' });
      await refreshPrefs();
    });
  });

  async function saveSetting(url, btn) {
    const orig = btn.textContent;
    const res = await fetch(url, { method: 'POST' }).then(r => r.json()).catch(() => ({}));
    btn.textContent = res.ok ? 'Saved' : 'Invalid';
    btn.blur();
    await refreshPrefs();
    setTimeout(() => { btn.textContent = orig; }, 1200);
  }

  document.getElementById('poll-save').addEventListener('click', () => {
    const v = document.getElementById('poll-input').value.trim();
    saveSetting('/set_poll?minutes=' + encodeURIComponent(v),
                document.getElementById('poll-save'));
  });

  document.getElementById('oneshot-save').addEventListener('click', () => {
    const v = document.getElementById('oneshot-input').value.trim();
    saveSetting('/set_liveness_pcts?pcts=' + encodeURIComponent(v),
                document.getElementById('oneshot-save'));
  });

  document.getElementById('delta-save').addEventListener('click', () => {
    const v = document.getElementById('delta-input').value.trim();
    saveSetting('/set_liveness_delta?pct=' + encodeURIComponent(v),
                document.getElementById('delta-save'));
  });

  // ---- Appearance section save buttons ----
  // Each row saves three fields (base_color, color_stops, fill_mode) for one
  // widget with three sequential POSTs; we wait for all before refreshing.
  async function saveWidgetAppearance(widgetName, baseId, stopsId, fillId, btnId) {
    const btn    = document.getElementById(btnId);
    const base   = document.getElementById(baseId).value.trim();
    const stops  = document.getElementById(stopsId).value.trim();
    const fill   = document.getElementById(fillId).value;
    const orig   = btn.textContent;
    // Three POSTs in sequence; any failure marks the button as invalid.
    try {
      const r1 = await fetch('/set_widget_color?widget=' + widgetName +
                             '&value=' + encodeURIComponent(base), { method: 'POST' })
                        .then(r => r.json()).catch(() => ({}));
      const r2 = await fetch('/set_widget_stops?widget=' + widgetName +
                             '&value=' + encodeURIComponent(stops), { method: 'POST' })
                        .then(r => r.json()).catch(() => ({}));
      const r3 = await fetch('/set_widget_fill?widget=' + widgetName +
                             '&value=' + encodeURIComponent(fill), { method: 'POST' })
                        .then(r => r.json()).catch(() => ({}));
      btn.textContent = (r1.ok && r2.ok && r3.ok) ? 'Saved' : 'Invalid';
    } catch {
      btn.textContent = 'Error';
    }
    btn.blur();
    await refreshPrefs();
    setTimeout(() => { btn.textContent = orig; }, 1200);
  }

  document.getElementById('sess-appearance-save').addEventListener('click', () =>
    saveWidgetAppearance('session', 'sess-base-color', 'sess-stops', 'sess-fill-mode',
                         'sess-appearance-save'));
  document.getElementById('week-appearance-save').addEventListener('click', () =>
    saveWidgetAppearance('weekly', 'week-base-color', 'week-stops', 'week-fill-mode',
                         'week-appearance-save'));
  document.getElementById('clock-appearance-save').addEventListener('click', () =>
    saveWidgetAppearance('clock', 'clock-base-color', 'clock-stops', 'clock-fill-mode',
                         'clock-appearance-save'));

  // Sync colour-picker swatches -> text inputs when the swatch changes.
  for (const [swatchId, textId] of [
    ['sess-base-swatch',  'sess-base-color'],
    ['week-base-swatch',  'week-base-color'],
    ['clock-base-swatch', 'clock-base-color'],
  ]) {
    document.getElementById(swatchId).addEventListener('input', e => {
      document.getElementById(textId).value = e.target.value.toUpperCase();
    });
  }

  // Only real action buttons carry data-action; the Save buttons reuse the
  // .action-btn look but must not fire a stray /action?name=undefined.
  document.querySelectorAll('.action-btn[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      // Uninstall is destructive and irreversible — gate it behind a confirm.
      if (action === 'uninstall' && !window.confirm(
            'Uninstall the Claude Usage widget?\n\n' +
            'This removes the start-at-login entry and all saved usage data, ' +
            'then quits. Installed builds also delete the app folder. ' +
            'This cannot be undone.')) {
        return;
      }
      fetch('/action?name=' + action, { method: 'POST' });
    });
  });

  // ---- collapsible sections ----
  // Each section's header toggles its body; state persists in localStorage.
  // Default is open for everything except Settings (kept closed to declutter).
  document.querySelectorAll('.section').forEach(sec => {
    const id    = sec.dataset.section;
    const title = sec.querySelector('.section-title');
    const saved = localStorage.getItem('section:' + id);
    const collapsed = saved === null ? (id === 'settings') : (saved === '1');
    sec.classList.toggle('collapsed', collapsed);
    title.addEventListener('click', () => {
      const nowCollapsed = !sec.classList.contains('collapsed');
      sec.classList.toggle('collapsed', nowCollapsed);
      localStorage.setItem('section:' + id, nowCollapsed ? '1' : '0');
    });
  });

  // ---- state polling ----

  async function refresh() {
    try {
      const s = await fetch('/state?t=' + Date.now()).then(r => r.json());
      const expired = s.session_end && new Date(s.session_end) < Date.now();
      const sPct = expired ? 0 : (s.session_pct ?? 0);
      const wPct = s.weekly_pct ?? 0;

      setGhost(sessFill, sessPath, sPct, 'session');
      sessPct.textContent  = Math.round(sPct) + '%';
      sessWhen.textContent = fmtWhen(s.session_end, 'session');

      setGhost(weekFill, weekPath, wPct, 'weekly');
      weekPct.textContent  = Math.round(wPct) + '%';
      weekWhen.textContent = fmtWhen(s.weekly_end, 'weekly');

      updateArc(s.session_start, s.session_end);
    } catch { /* server not up yet */ }
  }

  refresh();
  refreshPrefs();
  setInterval(refresh, 4000);
  setInterval(refreshPrefs, 8000);

  // ---- accuracy chart ----

  async function refreshSessions() {
    try {
      const sessions = await fetch('/sessions?t=' + Date.now()).then(r => r.json());
      const sel = document.getElementById('session-select');
      if (!sessions.length) {
        sel.innerHTML = '<option value="">No sessions on file</option>';
        return;
      }
      sel.innerHTML = sessions.map((s, i) =>
        `<option value="${s.at}">${s.label}${i === 0 ? ' (latest)' : ''}</option>`
      ).join('');
    } catch { /* server blip */ }
  }

  document.getElementById('chart-btn').addEventListener('click', async () => {
    const btn  = document.getElementById('chart-btn');
    const at   = document.getElementById('session-select').value;
    const img  = document.getElementById('chart-img');
    btn.textContent = 'Generating…';
    btn.disabled = true;
    try {
      const res = await fetch('/chart' + (at ? '?at=' + encodeURIComponent(at) : ''), { method: 'POST' });
      const { ok } = await res.json();
      if (ok) {
        img.src = '/chart_image?t=' + Date.now();
        img.style.display = 'block';
      } else {
        btn.textContent = 'Error — check console';
        return;
      }
    } catch {
      btn.textContent = 'Error';
      return;
    } finally {
      setTimeout(() => {
        btn.textContent = 'Generate';
        btn.disabled = false;
      }, 1500);
    }
  });

  refreshSessions();
</script>
</body>
</html>
